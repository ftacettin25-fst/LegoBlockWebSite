<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orders & Cart — Grids2Bricks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Mulish:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens-v2.css" />
  <link rel="stylesheet" href="../assets/css/base-v2.css" />
  <link rel="stylesheet" href="../assets/css/components-v2.css" />
  <link rel="stylesheet" href="../assets/css/pages-v2.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="announce">
    <div class="announce__inner">
      <span class="announce__msg"><i data-lucide="gift"></i> Free build guide PDF on every order</span>
      <span class="announce__links"><a href="account.html">Sign in</a><a href="order.html">Track order</a></span>
    </div>
  </div>
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="index.html">Grids2Bricks</a>
      <nav class="nav__links">
        <a href="create.html" data-nav-link>Customize</a>
        <a href="index.html#gallery" data-nav-link>Gallery</a>
        <a href="order.html" data-nav-link>Orders</a>
        <a href="index.html#faq" data-nav-link>FAQ</a>
      </nav>
      <div class="nav__spacer"></div>
      <div class="nav__icons">
        <span id="account-slot"></span>
        <a class="icon-btn" href="order.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span class="cart-badge" data-cart-badge>0</span></a>
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
      </div>
    </div>
    <div class="mobile-drawer" id="mobile-drawer">
      <a href="create.html">Customize</a><a href="index.html#gallery">Gallery</a>
      <a href="order.html">Orders</a><a href="account.html">Account</a>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="reveal" style="text-align:center;max-width:640px;margin:0 auto">
        <span class="eyebrow">Orders</span>
        <h1>Track your order & cart</h1>
        <p class="dim">Look up your order status or review what's in your cart.</p>
      </div>

      <div class="order-grid">
        <!-- Order lookup -->
        <div class="card reveal">
          <h3 style="margin-bottom:14px">Order lookup</h3>
          <div class="field">
            <label for="order-id">Order ID</label>
            <input id="order-id" class="input" placeholder="e.g. G2B-2025-0421" />
          </div>
          <button class="btn btn--primary" id="order-lookup"><i data-lucide="search"></i> Check status</button>
          <div id="order-result"></div>
        </div>

        <!-- Cart -->
        <div class="card reveal">
          <h3 style="margin-bottom:14px">Your cart</h3>
          <div id="cart-list"></div>
          <div id="cart-summary"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom"><span>© Grids2Bricks</span><span>Made with bricks ♥</span></div>
    </div>
  </footer>

  <script type="module" src="../assets/js/order.js"></script>
</body>
</html>
