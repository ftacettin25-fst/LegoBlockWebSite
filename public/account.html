<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account — Grids2Bricks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Mulish:wght@400;500;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/tokens-v2.css" />
  <link rel="stylesheet" href="../assets/css/base-v2.css" />
  <link rel="stylesheet" href="../assets/css/components-v2.css" />
  <link rel="stylesheet" href="../assets/css/pages-v2.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="brand" href="index.html">Grids2Bricks</a>
      <nav class="nav__links">
        <a href="index.html" data-nav-link>Home</a>
        <a href="create.html" data-nav-link>Create</a>
        <a href="order.html" data-nav-link>Order</a>
      </nav>
      <div class="nav__icons">
        <a class="icon-btn" href="order.html" aria-label="Cart"><i data-lucide="shopping-bag"></i><span
            class="cart-badge" data-cart-badge>0</span></a>
        <span id="account-slot"></span>
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
      </div>
    </div>
    <div class="mobile-drawer" id="mobile-drawer">
      <a href="index.html">Home</a>
      <a href="create.html">Create</a>
      <a href="order.html">Order</a>
      <a href="account.html">Account</a>
    </div>
  </header>


  <section>
    <div class="container">
      <div class="auth-wrap">
        <!-- Sign in / sign up -->
        <div class="card auth-card" id="auth-form-section">
          <h1>Welcome</h1>
          <p class="lead">Sign in to track your builds and orders.</p>

          <div class="tabs">
            <button class="tab active" data-tab="signin">Sign in</button>
            <button class="tab" data-tab="signup">Create account</button>
          </div>

          <button class="google-btn" id="google-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4"
                d="M21.6 12.227c0-.71-.064-1.39-.182-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.995 3.018v2.51h3.231c1.891-1.742 2.982-4.305 2.982-7.351z" />
              <path fill="#34A853"
                d="M12 22c2.7 0 4.964-.895 6.618-2.422l-3.23-2.51c-.896.6-2.04.955-3.388.955-2.605 0-4.81-1.76-5.595-4.123H3.064v2.59A9.997 9.997 0 0 0 12 22z" />
              <path fill="#FBBC05"
                d="M6.405 13.9a6.01 6.01 0 0 1 0-3.8V7.51H3.064a9.997 9.997 0 0 0 0 8.98l3.341-2.59z" />
              <path fill="#EA4335"
                d="M12 5.977c1.468 0 2.786.505 3.823 1.496l2.866-2.866C16.96 2.99 14.695 2 12 2A9.997 9.997 0 0 0 3.064 7.51l3.341 2.59C7.19 7.737 9.395 5.977 12 5.977z" />
            </svg>
            Continue with Google
          </button>

          <div class="auth-divider">or</div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" class="input" type="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" class="input" type="password" placeholder="••••••••" />
          </div>

          <div id="auth-error" class="alert alert--error" style="display:none;margin-bottom:12px"></div>

          <button class="btn btn--primary btn--block" id="submit-btn" data-mode="signin">Sign in</button>
          <div style="margin-top:10px;text-align:center">
            <a href="#" class="forgot" id="forgot-link">Forgot password?</a>
          </div>
        </div>

        <!-- Signed-in view -->
        <div class="card auth-card" id="auth-account-section" style="display:none">
          <h1>Your account</h1>
          <p class="lead">You're signed in.</p>
          <div class="account-info">
            <div class="account-info__row"><span>Email</span><span id="acc-email">—</span></div>
            <div class="account-info__row"><span>Sign-in method</span><span id="acc-method">—</span></div>
            <div class="account-info__row"><span>Account created</span><span id="acc-created">—</span></div>
          </div>
          <button class="btn btn--secondary btn--block" id="signout-btn"><i data-lucide="log-out"></i> Sign out</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom"><span>© Grids2Bricks</span><span>Made with bricks ♥</span></div>
    </div>
  </footer>

  <script type="module" src="../assets/js/account.js"></script>
  <script type="module">
    import { initNav, initReveal } from '../assets/js/nav.js';
    document.addEventListener('DOMContentLoaded', () => { initNav(); initReveal(); });
  </script>
</body>

</html>
