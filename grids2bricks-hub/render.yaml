services:
  - type: web
    name: grids2bricks
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.19.0
      - key: FAL_KEY
        sync: false
      - key: FIREBASE_KEY_PATH
        value: firebase_key.json
